<script>
/* Versão independente: troca os recursos do Claude por recursos do navegador */
window.CF_STANDALONE=true;window.CF_OCR='ocr/';
(function(){
  const caps={
    artifact:async()=>null,
    downloads:async()=>({save:async({filename,data})=>{
      const b=new Blob([data],{type:/\.json$/i.test(filename)?'application/json':'text/csv;charset=utf-8'});
      const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();
      setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}}),
    mcp:async()=>({callTool:async(server,tool,input)=>{
      if(tool==='TM_Indices_Performance'){
        const r=await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
        if(!r.ok)throw {code:'upstream_error'};
        const j=await r.json(),v=parseFloat(j&&j.USDBRL&&j.USDBRL.bid);
        if(!(v>0))throw {code:'upstream_error'};
        return {payload:{endValue:v}};
      }
      throw {code:'tool_error'};
    }}),
    dictation:async()=>{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
      let rec=null,p=()=>{},f=()=>{},s=()=>{};
      return {onPartial:fn=>{p=fn},onFinal:fn=>{f=fn},onState:fn=>{s=fn},
        start:()=>new Promise((res,rej)=>{
          rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=true;
          rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}if(part)p({text:part});if(fin)f({text:fin})};
          rec.onstart=()=>{s({state:'listening'});res()};
          rec.onend=()=>s({state:'idle'});
          rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')rej({code:'not_granted'});s({state:'idle'})};
          try{rec.start()}catch(e){rej(e)}}),
        stop:()=>{try{rec&&rec.stop()}catch(e){}return Promise.resolve()}};
    }
  };
  window.claude={use:async n=>{try{return caps[n]?await caps[n]():null}catch(e){return null}}};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();

<title>Controle Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
/* Layout: app shell — barra inferior + botão + no celular, menu lateral no computador; saldo em destaque no topo */
:root{
  --bg:#f2f4f8;--surface:#ffffff;--surface2:#eceff5;--tx:#131a2a;--mut:#5b6478;--bd:#e1e5ee;
  --acc:#2f4fd8;--acc-ink:#ffffff;--accbg:#e8ecff;
  --pos:#0f8a5f;--posbg:#e2f4ec;--neg:#cf3a1d;--negbg:#fcebe6;--warn:#a86a10;--warnbg:#fbf1dc;
  --fix:#2f4fd8;--var:#df7414;--card-c:#8a4fd6;
  --hero:#151d3d;--hero-tx:#f3f5ff;--hero-mut:#a7b0d4;--hero-track:rgba(255,255,255,.12);
  --h-fix:#8fa3ff;--h-card:#c9a4ff;--h-var:#ffa457;--h-res:#5fd8ab;--h-neg:#ff8e74;
  --sh:0 1px 2px rgba(21,29,61,.05),0 6px 20px rgba(21,29,61,.06);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a;--surface:#131a2a;--surface2:#1a2235;--tx:#e8ecf7;--mut:#939cb4;--bd:#242c42;
  --acc:#8fa3ff;--acc-ink:#0b0f1a;--accbg:#1d2647;
  --pos:#3fcf94;--posbg:#0f2c22;--neg:#ff7a5c;--negbg:#351a15;--warn:#f2b54a;--warnbg:#33270f;
  --fix:#8fa3ff;--var:#ffa04d;--card-c:#c9a4ff;
  --hero:#1a2452;--hero-track:rgba(255,255,255,.1);--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1a;--surface:#131a2a;--surface2:#1a2235;--tx:#e8ecf7;--mut:#939cb4;--bd:#242c42;
  --acc:#8fa3ff;--acc-ink:#0b0f1a;--accbg:#1d2647;
  --pos:#3fcf94;--posbg:#0f2c22;--neg:#ff7a5c;--negbg:#351a15;--warn:#f2b54a;--warnbg:#33270f;
  --fix:#8fa3ff;--var:#ffa04d;--card-c:#c9a4ff;
  --hero:#1a2452;--hero-track:rgba(255,255,255,.1);--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.a,.hv,.kv-v{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.sm{font-size:12.5px}

/* shell */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-block:14px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.top .brand{flex:1 1 auto}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--hero-tx);display:grid;place-items:center;flex:none;font:700 15px var(--f-num)}
.brand h1{font:700 17px/1.1 var(--f-num);margin:0;letter-spacing:-.01em}
.status{font-size:11.5px;color:var(--mut);min-height:14px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--bd);border-radius:99px;padding:3px}
.month b{min-width:132px;text-align:center;font-weight:600;font-size:14px}
.month button{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.month button:hover{background:var(--surface2);color:var(--tx)}
.month .today{width:auto;padding:0 12px;border-radius:99px;background:var(--accbg);color:var(--acc);font-size:12.5px;font-weight:600}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:10.5px;font-weight:600;border-radius:12px}
.bnav button.on{color:var(--acc)}
.bnav button.on svg{background:var(--accbg);border-radius:99px;padding:3px 12px;width:48px!important;height:28px!important}
.bnav svg{padding:3px 12px;width:48px!important;height:28px!important}
.fab{position:fixed;z-index:9;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:19px;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}
.fab:active{transform:scale(.96)}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:236px;flex:none;padding:22px 14px;border-right:1px solid var(--bd);background:var(--surface)}
  .side .brand{padding:0 8px 18px}
  .side .nv{border:0;background:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:600;font-size:14px;text-align:left}
  .side .nv:hover{background:var(--surface2);color:var(--tx)}
  .side .nv.on{background:var(--accbg);color:var(--acc)}
  .side .pri{margin:0 0 14px;justify-content:center;padding:11px}
  .bnav,.fab,.top .brand{display:none}
  .top{justify-content:flex-end}
  .main{padding-block:24px 48px}
}

/* buttons */
.btn,.pri,.sec{border:1px solid var(--bd);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--tx)}
.btn:hover,.sec:hover{border-color:var(--acc)}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.pri:hover{filter:brightness(1.07)}
.sec{background:var(--surface2);border-color:transparent}
.danger{color:var(--neg)}
.mini{padding:6px 11px;font-size:12.5px;border-radius:10px}
.icon{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none}
.icon:hover{background:var(--surface2);color:var(--tx)}
.icon.danger:hover{color:var(--neg)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.card h3,.sh{font:600 15px/1.3 var(--f-ui);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:600;color:var(--mut);font-size:13px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.pt{font:700 24px/1.15 var(--f-num);margin:0;letter-spacing:-.015em}
.ps{margin:4px 0 0;color:var(--mut);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.hint{font-size:12.5px;color:var(--mut);margin:10px 0 0}

/* hero */
.hero{background:var(--hero);color:var(--hero-tx);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(143,163,255,.28),transparent 70%);pointer-events:none}
.hl{font-size:13px;color:var(--hero-mut);font-weight:500}
.hv{font:700 clamp(34px,9vw,46px)/1.05 var(--f-num);letter-spacing:-.02em}
.hv.neg{color:var(--h-neg)}
.hs{font-size:13px;color:var(--hero-mut)}
.hs b{color:var(--hero-tx)}
.hs b.neg{color:var(--h-neg)}
.hbar{display:flex;height:12px;border-radius:99px;background:var(--hero-track);overflow:hidden;margin-top:12px;gap:2px}
.hbar i{display:block;height:100%}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--hero-mut);margin-top:4px}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:8px;height:8px;border-radius:3px;display:inline-block}
.hleg b{color:var(--hero-tx);font-weight:600}
.hfoot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hero-track)}
.hfoot span{display:block;font-size:11.5px;color:var(--hero-mut)}
.hfoot b{font:600 15px var(--f-num);font-variant-numeric:tabular-nums}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:759px){.kpis>:last-child:nth-child(odd){grid-column:1/-1}}
@media (min-width:760px){.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;box-shadow:var(--sh)}
button.kpi:hover{border-color:var(--acc)}
.kpi .l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mut)}
.kpi .l i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.kpi .v{font:700 20px/1.2 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--mut)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px}
.bar.lg{height:10px}
.bar i.over{background:var(--neg)}.bar i.warn{background:var(--warn)}.bar i.good{background:var(--pos)}

/* alerts */
.al{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.al:first-of-type{border-top:0;padding-top:0}
.al .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.al.neg .ic{background:var(--negbg);color:var(--neg)}
.al.warn .ic{background:var(--warnbg);color:var(--warn)}
.al p{margin:0;flex:1;min-width:0;font-size:14px;font-weight:500}

/* lists */
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}
.it .n{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;padding:0;text-align:left}
button.n{cursor:pointer}
button.n:hover b{color:var(--acc)}
.it .n b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .n span{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .a{font-weight:700;white-space:nowrap;font-size:14.5px}
.it.done .n b{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.it.done .a{color:var(--mut)}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.tag{display:inline-block;font-size:10.5px;font-style:normal;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-left:6px;vertical-align:1px;text-decoration:none}
.tag.warn{background:var(--warnbg);color:var(--warn)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border-radius:50%;border:2px solid var(--bd);background:var(--surface);display:grid;place-content:center;flex:none;cursor:pointer;transition:background .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:6px;height:11px;border:solid var(--acc-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:var(--pos);border-color:var(--pos)}
input[type=checkbox]:checked::before{transform:rotate(45deg) translate(-1px,-1px) scale(1);border-color:var(--surface)}
input[type=checkbox]:hover{border-color:var(--pos)}
.day+.day{margin-top:14px}
.dh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.kv:first-of-type{border-top:0;padding-top:0}
.kv-v{font-weight:600;white-space:nowrap}
.orc+.orc{margin-top:14px}
.orc-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.orc-h b{font-weight:600}
.orc .sm{margin-top:5px;color:var(--mut)}
.empty{padding:24px 10px;text-align:center;color:var(--mut);font-size:14px}
.big-n{font:700 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}

/* forms */
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--mut);min-width:0}
label.chk{flex-direction:row;align-items:center;gap:10px;font-size:13.5px;font-weight:500;color:var(--tx)}
label.chk input{width:22px;height:22px;border-radius:7px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--surface)}
input:disabled{opacity:.5}
textarea{min-height:150px;resize:vertical;line-height:1.6}
input.big{font:700 34px/1.1 var(--f-num)!important;text-align:center;background:transparent!important;border:0!important;padding:6px 0!important;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg label{display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut)}
.seg input:checked+span{background:var(--surface);color:var(--tx);box-shadow:var(--sh)}
.seg input[value=despesa]:checked+span{color:var(--neg)}
.seg input[value=entrada]:checked+span{color:var(--pos)}
.seg input:focus-visible+span{outline:2px solid var(--acc)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* charts */
.legend{list-style:none;padding:0;margin:0;flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
.chartrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chartrow svg{flex:none;width:140px;height:140px}
.pv{overflow-x:auto;margin:0 -4px}
.pv table{width:100%;border-collapse:collapse;font-size:13px}
.pv td{padding:4px;vertical-align:middle}
.pv thead td{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.pv input,.pv select{padding:7px 8px!important;font-size:13.5px!important}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 0;border-top:1px solid var(--bd);text-align:left}
.menu button:first-child{border-top:0;padding-top:0}
.menu .av{--c:var(--acc)}
.menu b{display:block;font-weight:600}
.menu small{color:var(--mut);font-size:12.5px}

/* modal / sheet */
.modalbg{position:fixed;inset:0;background:rgba(8,12,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fd .18s ease}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.modal::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--bd);margin:0 auto 12px}

function monthData(m){
  const rec=recAtiva(m),tx=S.tx.filter(t=>t.data.startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data));
  const pg=S.pagos[m]||{},parc=parcDoMes(m),metas=metasDoMes(m);

  const cats={},orcs=[],claimed={},porQuem={};
  const orcCats=new Set(rec.filter(r=>r.orc&&r.tipo==='despesa').map(r=>r.cat));
  const catSpent=c=>tx.filter(t=>t.tipo==='despesa'&&t.cat===c).reduce((s,t)=>s+t.valor,0);
  rec.forEach(r=>{const v=recVal(r,m),done=!!pg[r.id];
    if(r.tipo==='entrada'){entPrev+=v;if(done)entReal+=v}
    else if(r.orc){const sp=claimed[r.cat]?0:catSpent(r.cat);claimed[r.cat]=true;const used=Math.min(sp,v),extra=Math.max(0,sp-v);fixPrev+=v;fixReal+=used;vr+=extra;cats[r.cat]=(cats[r.cat]||0)+v+extra;orcs.push({r,v,spent:sp,left:v-sp,extra})}

  parc.forEach(x=>{cartPrev+=x.valor;if(pg['p'+x.p.id])cartReal+=x.valor;cats[x.p.cat]=(cats[x.p.cat]||0)+x.valor;const q=x.p.quem||'Casa';porQuem[q]=(porQuem[q]||0)+x.valor});

function numP(s){s=String(s==null?'':s).replace(/R\$|US\$|\$|\s/gi,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');const n=parseFloat(s);return isFinite(n)?Math.round(n*1e6)/1e6:NaN}
function numQ(s){s=String(s==null?'':s).replace(/\s/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isFinite(n)?Math.round(n*1e8)/1e8:NaN}

const staleTag=d=>!d?'<i class="tag warn">sem cotação</i>':d===todayStr?'<i class="tag">hoje</i>':`<i class="tag warn">de ${dmy(d)}</i>`;
/* renda fixa com índice: saldo bruto, IOF, IR e líquido, contando só dias úteis */
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),12);
const addD=(s,n)=>{const d=dOf(s);d.setDate(d.getDate()+n);return isoD(d)};
const daysB=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const HOL={};
function holi(y){if(HOL[y])return HOL[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,k=Math.floor(c/4),m=c%4,l=(32+2*e+2*k-h-m)%7,n=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*n+114)/31),dy=((h+l-7*n+114)%31)+1;
  const pas=new Date(y,mo-1,dy,12),s=new Set(),add=n=>{const x=new Date(pas);x.setDate(x.getDate()+n);s.add(isoD(x))};
  [[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[12,25]].forEach(([mm,dd])=>s.add(y+'-'+pad(mm)+'-'+pad(dd)));
  if(y>=2024)s.add(y+'-11-20');
  add(-48);add(-47);add(-2);add(60);
  return HOL[y]=s}
const isDU=s=>{const w=dOf(s).getDay();return w>0&&w<6&&!holi(+s.slice(0,4)).has(s)};
const prevDU=s=>{let x=addD(s,-1);while(!isDU(x))x=addD(x,-1);return x};
function duN(a,b){let n=0,x=a;while(x<b){x=addD(x,1);if(isDU(x))n++}return n}
function ipcaF(a,b){
  const ks=Object.keys(S.idx.ipca).sort(),last=ks.length?S.idx.ipca[ks[ks.length-1]]:0;let f=1,est=false,cur=a;
  while(cur<b){const m=cur.slice(0,7),y=+m.slice(0,4),mo=+m.slice(5,7),nm=mo===12?(y+1)+'-01-01':y+'-'+pad(mo+1)+'-01',end=nm<b?nm:b,dim=new Date(y,mo,0).getDate();
    let r=S.idx.ipca[m];if(r==null){r=last;est=true}
    f*=Math.pow(1+r/100,daysB(cur,end)/dim);cur=end}
  return {f,est}}
function lotG(i,l,ref){
  const tx=+i.tx||0;if(!i.idx||ref<=l.d)return l.v;
  if(i.idx==='pre')return l.v*Math.pow(1+tx/100,duN(l.d,ref)/252);
  if(i.idx==='cdi'){let f=1;const c=S.idx.cdi;for(const k in c){if(k>l.d&&k<=ref)f*=1+c[k]/100*tx/100}return l.v*f}
  if(i.idx==='ipca')return l.v*ipcaF(l.d,ref).f*Math.pow(1+tx/100,duN(l.d,ref)/252);

const IOFT=[96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3,0];
const iofP=d=>d<=0||d>=30?0:IOFT[d-1]/100;
const irP=d=>d>720?.15:d>360?.175:d>180?.2:.225;
function rfCalc(i,ref){

  let vd=ref||prevDU(todayStr),sem=false;

  let bruto=0,princ=0,iof=0,ir=0,est=false,dia=0;const pv=prevDU(vd);
  i.lotes.forEach(l=>{const g=lotG(i,l,vd),gain=g-l.v,dias=daysB(l.d,todayStr);let io=0,r=0;
    if(i.trib!=='isento'&&gain>0){io=gain*iofP(dias);r=(gain-io)*irP(dias)}
    bruto+=g;princ+=l.v;iof+=io;ir+=r;dia+=g-lotG(i,l,pv);if(i.idx==='ipca'&&ipcaF(l.d,vd).est)est=true});
  return {bruto,princ,iof,ir,liq:bruto-iof-ir,vd,dia,est,sem}}
function rfSync(){let ch=false;S.inv.forEach(i=>{if(i.tipo!=='rf'||!i.idx||!i.lotes||!i.lotes.length)return;const c=rfCalc(i);if(!c)return;
  const b=Math.round(c.bruto*100)/100,md=i.lotes.reduce((m,l)=>l.d>m?l.d:m,c.vd);
  if(Math.abs((i.atual||0)-b)>0.004||i.atualData!==md){i.atual=b;i.atualData=md;ch=true}});return ch}

/* fechamento do mês */
function fechInfo(m){
  const d=monthData(m),pend=[];
  d.rec.filter(r=>r.tipo==='despesa'&&!r.orc&&!d.pg[r.id]).forEach(r=>pend.push(r.nome+' · a pagar '+brl(recVal(r,m))));
  d.rec.filter(r=>r.tipo==='entrada'&&!d.pg[r.id]).forEach(r=>pend.push(r.nome+' · a receber '+brl(recVal(r,m))));
  d.parc.filter(x=>!d.pg['p'+x.p.id]).forEach(x=>pend.push(x.p.nome+' ('+x.k+'/'+x.p.n+') · '+brl(x.valor)));
  d.metas.filter(g=>!d.pg['m'+g.id]).forEach(g=>pend.push('Aporte '+g.nome+' · '+brl(g.mensal)));
  return {d,pend,sobra:d.saldoPrev};
}

function vFech(){

  }else{
    acao=`<div class="card"><h3>Fechar o mês</h3>${sobra>0?`<p class="hint" style="margin:-4px 0 12px">Quanto da sobra de <b>${brl(sobra)}</b> você quer guardar?</p><div class="chips" style="margin-bottom:12px">${[25,50,75,100].map(pc).join('')}</div>`:`<p class="hint" style="margin:-4px 0 12px">${sobra<0?'O mês fechou no negativo. Não há sobra para guardar.':'Sem sobra neste mês.'}</p>`}
    <form class="f" data-f="fechar">${sobra>0?`<label>Valor a guardar (R$)<input id="fval" name="valor" inputmode="decimal" placeholder="0,00" value="${String(Math.round(sobra*50)/100).replace('.',',')}"></label><label>Destino<select name="dest"><option value="none">Só registrar</option>${opt}</select></label>`:''}<div class="btns full"><button class="pri" type="submit">Fechar ${esc(mname(view))}</button></div></form></div>`;
  }
  const hist=Object.entries(S.fech).sort((a,b)=>b[0].localeCompare(a[0]));
  const hc=hist.length?`<div class="card"><h3>Meses fechados <small>${hist.length}</small></h3>${hist.map(([m,x])=>`<div class="kv"><span>${esc(cap(mlabel(m)))}</span><span class="kv-v ${x.sobra<0?'neg':'pos'}">${brl(x.sobra)}${x.dest?` <span class="mut">→ ${esc(x.dest.nome)}</span>`:''}</span></div>`).join('')}</div>`:'';
  return pageHead('Fechar o mês','Veja a sobra, resolva pendências e destine o que sobrou.')+resumo+pend+acao+hc;
}

/* ---------- cotações automáticas ---------- */
const MCP='Minhas Economias';
let qbusy=false;
const FATAL=['needs_reauth','approval_required','declined','blocked_by_policy','not_in_manifest','server_not_connected'];
const qErr=e=>{const c=e&&e.code;return c==='needs_reauth'?'Reconecte o conector Minhas Economias no claude.ai.':c==='server_not_connected'?'O conector Minhas Economias não está conectado.':(c==='approval_required'||c==='declined')?'Autorize o acesso às cotações para atualizar sozinho.':(c==='blocked_by_policy'||c==='not_in_manifest')?'Acesso às cotações bloqueado neste app.':(c==='server_unavailable'||c==='upstream_error')?'Serviço de cotações indisponível agora.':'Não consegui buscar algumas cotações.'};
const qPayload=r=>{let p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}if(p&&p.result&&typeof p.result==='object'&&!Array.isArray(p.result))p=p.result;return p};
async function fetchUsd(m){
  const d=new Date(Date.now()-7*864e5),ds=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  const p=qPayload(await m.callTool(MCP,'TM_Indices_Performance',{cdIndex:1,dtStart:ds,dtEnd:0}));
  const v=p&&+p.endValue;return v>0?v:null;
}
async function fetchPx(m,tk){
  const p=qPayload(await m.callTool(MCP,'RT_CotacaoHistoricoPreco',{cd_stock:tk,id_exchange:1,group_method:'MINUTE',group_factor:1,id_point:0,limit:3,direction:'desc'}));
  const vs=p&&p.vl_close,ts=p&&p.id_point;if(!Array.isArray(vs)||!vs.length)return null;
  let bi=0;if(Array.isArray(ts))ts.forEach((t,i)=>{if(t>ts[bi])bi=i});
  const v=+vs[bi],t=Array.isArray(ts)?+ts[bi]:0;if(!(v>0))return null;
  const dt=t>0?new Date(t):new Date(),ds=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  return {v:Math.round(v*1e4)/1e4,d:ds};
}
const usdN=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3});
const usdChip=()=>{const u=S.cot.usd;return `<button class="usdchip" data-a="qrefresh" title="Atualizar cotações"><b>Dólar</b> ${u?'R$ '+usdN(u):'—'} <small>${qbusy?'atualizando…':u?(S.cot.usdData===todayStr?'hoje':'de '+dmy(S.cot.usdData)):'toque'}</small></button>`};
function patchChip(){const el=$('.usdchip');if(el)el.outerHTML=usdChip()}
function persistQuiet(){S.v=Date.now();saveLocal();clearTimeout(timer);setStatus('Salvando…');timer=setTimeout(doPublish,1200)}
let xbusy=false;
function fhKey(){try{return (localStorage.getItem('cf_fhkey')||'').trim()}catch(e){return ''}}
async function refreshExt(manual){
  const tks=[...new Set(S.inv.filter(i=>i.tipo==='ext').map(i=>tick(i.nome)))];
  if(!tks.length||xbusy)return;
  const k=fhKey();
  if(!k){if(manual)toast('Informe a chave da Finnhub em Mais > Configurações para buscar ações dos EUA.');return}
  xbusy=true;let ch=false,fail=0,bad=0;
  await Promise.all(tks.map(async tk=>{
    try{
      const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(tk)+'&token='+encodeURIComponent(k));
      if(r.status===401||r.status===403){bad++;return}
      if(!r.ok){fail++;return}
      const j=await r.json(),c=+j.c;
      if(!(c>0)){fail++;return}
      const dt=j.t>0?new Date(j.t*1000):new Date(),ds=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()),o=S.cot.t['US:'+tk];
      if(!o||o.v!==c||o.d!==ds){S.cot.t['US:'+tk]={v:Math.round(c*1e4)/1e4,d:ds};ch=true}
    }catch(e){fail++}
  }));
  xbusy=false;
  if(ch)persistQuiet();
  if(modal||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||''))patchChip();else render();
  if(bad)toast('A chave da Finnhub foi recusada. Confira se copiou inteira.');
  else if(fail)toast('Não consegui buscar '+(fail>1?'alguns ativos':'um ativo')+' dos EUA agora (o navegador ou a Finnhub bloqueou). Digite o preço à mão.');
  else if(manual)toast('Cotações dos EUA atualizadas.');
}
async function refreshQuotes(manual){
  refreshExt(manual);refreshIdx(manual);
  if(qbusy)return;
  let m=null;try{m=window.claude&&window.claude.use?await window.claude.use('mcp'):null}catch(e){m=null}
  if(!m){if(manual)toast('Cotação automática indisponível aqui. Informe os valores à mão.');return}
  qbusy=true;patchChip();
  const tks=window.CF_STANDALONE?[]:[...new Set(S.inv.filter(i=>i.tipo==='acao').map(i=>tick(i.nome)))];
  let ch=false,err=null,ok=0;
  try{const u=await fetchUsd(m);if(u){ok++;if(u!==S.cot.usd||S.cot.usdData!==todayStr){S.cot.usd=u;S.cot.usdData=todayStr;ch=true}}else err=err||{code:'x'}}catch(e){err=e||{code:'x'}}
  if(!(err&&FATAL.includes(err.code))){
    const rs=await Promise.all(tks.map(async t=>{try{return [t,await fetchPx(m,t),null]}catch(e){return [t,null,e||{code:'x'}]}}));
    rs.forEach(([t,q,e])=>{if(q){ok++;const o=S.cot.t[t];if(!o||o.v!==q.v||o.d!==q.d){S.cot.t[t]=q;ch=true}}else err=err||e||{code:'x'}});
  }
  qbusy=false;
  if(ch)persistQuiet();
  if(modal||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||''))patchChip();else render();
  if(err)toast(qErr(err));else if(manual)toast(S.inv.some(i=>i.tipo==='ext')?'Cotações atualizadas.':'Cotações atualizadas.');
}

/* ---------- exportação ---------- */
function csvMonth(m){
  const d=monthData(m),rows=[];
  d.rec.forEach(r=>{const v=recVal(r,m),ent=r.tipo==='entrada',o=d.orcs.find(x=>x.r===r);
    rows.push([m,ent?'Entrada fixa':(r.orc?'Orçamento':'Despesa fixa'),r.nome,r.cat,'Casa',String(r.dia),v,r.orc?('gasto '+(o?o.spent:0).toFixed(2).replace('.',',')):(d.pg[r.id]?(ent?'recebido':'pago'):(ent?'a receber':'a pagar'))])});
  d.parc.forEach(x=>rows.push([m,'Cartão '+x.k+'/'+x.p.n,x.p.nome,x.p.cat,x.p.quem||'Casa',String(x.p.dia||10),x.valor,d.pg['p'+x.p.id]?'pago':'a pagar']));
  d.metas.forEach(g=>rows.push([m,'Reserva',g.nome,'Reserva / metas','Casa','',g.mensal,d.pg['m'+g.id]?'guardado':'a guardar']));
  d.tx.forEach(t=>rows.push([m,t.tipo==='entrada'?'Entrada avulsa':'Despesa variável',t.nome,t.cat,t.quem||'Casa',t.data.slice(8),t.valor,'']));
  return rows;
}
function toCSV(rows){
  const head=['Mês','Tipo','Descrição','Categoria','Quem','Dia','Valor (R$)','Status'];
  return '﻿'+[head].concat(rows).map(r=>r.map(c=>{const s=typeof c==='number'?c.toFixed(2).replace('.',','):String(c);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n');
}
function allMonths(){
  let a=curM,b=curM;
  S.rec.forEach(r=>{if(r.ini<a)a=r.ini});
  S.tx.forEach(t=>{const m=t.data.slice(0,7);if(m<a)a=m;if(m>b)b=m});
  S.parc.forEach(p=>{if(p.ini<a)a=p.ini;const e=addM(p.ini,p.n-1);if(e>b)b=e});
  S.metas.forEach(g=>{if(g.ini<a)a=g.ini});
  const out=[];let m=a;while(m<=b&&out.length<72){out.push(m);m=addM(m,1)}return out;
}

/* ---------- gráficos ---------- */
function donut(cats){
  const ent=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const tot=ent.reduce((s,e)=>s+e[1],0);
  if(!tot)return '<div class="empty">Sem despesas neste mês.</div>';
  const R=72,r=50,cx=80,cy=80;let a0=-Math.PI/2,paths='';
  const p=(a,rad)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
  const col=k=>catColor(k,'despesa');
  ent.forEach(([k,v])=>{
    const f=v/tot,a1=a0+f*2*Math.PI,c=col(k);
    if(f>0.9999)paths+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${c}" stroke-width="${R-r}"><title>${esc(k)}</title></circle>`;
    else{const lg=f>.5?1:0;const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
      paths+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${c}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(k)}: ${brl(v)}</title></path>`}
    a0=a1;
  });
  paths+=`<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="var(--f-ui)">total</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="var(--tx)" font-family="var(--f-num)">${esc(brl(tot).replace(/,\d\d$/,''))}</text>`;
  const leg=ent.map(([k,v])=>`<li><i style="background:${col(k)}"></i><span>${esc(k)}</span><em>${brl(v)} · ${Math.round(v/tot*100)}%</em></li>`).join('');
  return `<div class="chartrow"><svg viewBox="0 0 160 160" role="img" aria-label="Despesas por categoria">${paths}</svg><ul class="legend">${leg}</ul></div>`;
}
function bars(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(addM(view,-i));
  const d=ms.map(m=>{const x=monthData(m);return {m,e:x.entPrev,s:x.gasto}});
  const mx=Math.max(1,...d.map(x=>Math.max(x.e,x.s)));
  const W=360,H=150,base=118,hh=96,gw=58;let g='';
  [0.5,1].forEach(f=>{g+=`<line x1="6" x2="354" y1="${base-hh*f}" y2="${base-hh*f}" stroke="var(--bd)" stroke-dasharray="3 4"/>`});
  g+=`<line x1="6" x2="354" y1="${base}" y2="${base}" stroke="var(--bd)"/>`;
  d.forEach((x,i)=>{const x0=i*gw+14,he=x.e/mx*hh,hs=x.s/mx*hh,cur=x.m===view;
    g+=`<rect x="${x0}" y="${base-he}" width="18" height="${he}" rx="4" fill="var(--pos)" opacity="${cur?1:.55}"><title>${mshort(x.m)} · entradas ${brl(x.e)}</title></rect>`;
    g+=`<rect x="${x0+21}" y="${base-hs}" width="18" height="${hs}" rx="4" fill="var(--var)" opacity="${cur?1:.55}"><title>${mshort(x.m)} · despesas ${brl(x.s)}</title></rect>`;
    g+=`<text x="${x0+19.5}" y="${base+18}" text-anchor="middle" font-size="11" font-weight="${cur?700:500}" fill="${cur?'var(--tx)':'var(--mut)'}">${mshort(x.m)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Entradas e despesas dos últimos 6 meses">${g}</svg>
  <div class="hleg" style="color:var(--mut)"><span><i style="background:var(--pos)"></i>Entradas</span><span><i style="background:var(--var)"></i>Despesas (fixas, cartão e variáveis)</span></div>`;
}

const addBtn=(m,l)=>`<button class="pri" data-a="open" data-m="${m}">${ic('plus',18)}<span>${l}</span></button>`;
function orcHtml(o){

function vComp(d){
  const pm=monthData(addM(view,-1));
  if(!(pm.entPrev+pm.gasto>0))return '';
  const dl_=(a,b,goodUp)=>{const x=a-b;if(Math.abs(x)<0.005)return '<span class="mut">igual</span>';const up=x>0,good=goodUp?up:!up;return `<b class="kv-v ${good?'pos':'neg'}">${up?'▲':'▼'} ${brl(Math.abs(x))}</b>`};

const CATMAP=[[/alug|condom|iptu|financiamento im|reforma/,'Moradia'],[/luz|energia|[aá]gua|\bg[aá]s\b|internet|telefone|celular|wi-?fi|tv a cabo/,'Contas da casa'],[/mercado|supermercado|feira|padaria|a[cç]ougue|comida|restaurante|lanche|ifood/,'Mercado'],[/combust|gasolina|[oô]nibus|metr[oô]|uber|99|ped[aá]gio|carro|moto|estacionamento|ipva|seguro auto/,'Transporte'],[/m[eé]dic|farm[aá]cia|plano de sa|sa[uú]de|dentista|academia|terapia|psic/,'Saúde'],[/escola|faculdade|curso|mensalidade|livro/,'Educação'],[/cinema|viagem|lazer|bar|show|jogo|passeio/,'Lazer'],[/netflix|spotify|assinatura|prime|disney|youtube|streaming/,'Assinaturas'],[/cart[aã]o|fatura|empr[eé]stimo|d[ií]vida|parcela|consignado/,'Cartão e dívidas']];
function guessCat(nome,entrada){
  const n=nome.toLowerCase();
  if(entrada)return /sal[aá]rio|pagamento|holerite/.test(n)?'Salário':/freela|extra|bico|venda/.test(n)?'Extra / freela':/rendimento|dividendo|juros|aluguel recebido/.test(n)?'Rendimentos':'Outros';
  for(const [re,c] of CATMAP)if(re.test(n))return c;return 'Outros';
}
function parseLinha(l){

  if(md){dia=Math.min(31,Math.max(1,+md[1]));low=low.replace(md[0],' ')}
  let quem='Casa';const mq=low.match(/\b(djony|mariene)\b/);
  if(mq){quem=mq[1].charAt(0).toUpperCase()+mq[1].slice(1);low=low.replace(mq[0],' ')}
  let n=null;const mn=low.match(/\b(?:em\s+)?(\d{1,2})\s*x\b/)||low.match(/\bparcelad[oa]s?\s+(?:em\s+)?(\d{1,2})\b/);
  if(mn){n=Math.min(48,Math.max(1,+mn[1]));low=low.replace(mn[0],' ')}
  const cartao=/\bcart[aã]o\b/.test(low);
  const mv=low.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  if(!mv)return null;
  const valor=parseValor(mv[1]);if(!isFinite(valor)||valor<=0)return null;
  const entrada=/\b(entrada|receita|recebi|recebo|sal[aá]rio|renda|freela|freelance|rendimento)\b/.test(low);
  let fixa=/\b(fix[ao]s?|mensal|todo\s+m[eê]s)\b/.test(low);
  const varia=/\bvari[aá]ve(l|is)\b/.test(low);
  if(varia)fixa=false;else if(!fixa&&/sal[aá]rio/.test(low))fixa=true;

    .replace(/[:;,\-–=]/g,' ').replace(/\b(de|do|da|em|no|na|é|são|foi|uma|um|a|o)\b(?=\s*$)/g,' ').replace(/^\s*(de|do|da|é|são)\s+/,'').replace(/\s+/g,' ').trim();
  nome=nome?nome.charAt(0).toUpperCase()+nome.slice(1):'Sem descrição';
  let kind=entrada?(fixa?'ef':'ev'):(fixa?'df':'dv');
  if(!entrada&&!fixa&&(n||cartao)){kind='cc';n=n||1}
  return {nome,valor,kind,cat:guessCat(nome,entrada),dia,quem,n,tags:parseTags(tg.join(','))};
}

  document.body.classList.add('locked');
  const w=Math.max(0,Math.ceil((encWaitUntil-Date.now())/1000));
  l.innerHTML=encForget?`<div class="lk"><span class="logo">R$</span><h2>Esqueceu a senha?</h2><p>Não há como recuperar os dados criptografados sem a senha. Você pode apagar os dados deste aparelho e começar de novo, ou restaurar depois um backup sem criptografia.</p><button type="button" class="pri" data-k="wipe" style="width:100%">Apagar dados deste aparelho</button><button type="button" class="lk-f" data-k="back">Voltar</button></div>`
  :`<div class="lk"><span class="logo">R$</span><h2>Controle Financeiro</h2><p>Dados protegidos. Digite a senha.</p><input id="encpw" type="password" autocomplete="current-password" placeholder="Senha"${w?' disabled':''}><div class="lk-m" role="status">${esc(w?'Muitas tentativas. Aguarde '+w+'s.':(msg||''))}</div><button type="button" class="pri" data-k="go" style="width:100%"${w?' disabled':''}>Desbloquear</button><button type="button" class="lk-f" data-k="forget">Esqueci a senha</button></div>`;
  clearInterval(encTick);if(w)encTick=setInterval(()=>{if(Date.now()>=encWaitUntil){clearInterval(encTick);encLockDraw()}else encLockDraw()},1000);
  else{const i=document.getElementById('encpw');if(i)setTimeout(()=>{try{i.focus()}catch(e){}},50)}}
async function encTry(){const i=document.getElementById('encpw'),pw=i?i.value:'';if(!pw||Date.now()<encWaitUntil)return;
  const b=document.querySelector('#lock [data-k=go]');if(b){b.disabled=true;b.textContent='Verificando…'}
  let best=null;
  for(const bl of ENCBLOBS){try{const r=await decBlob(bl,pw);if(!best||(r.obj.v||0)>(best.obj.v||0))best=r}catch(e){}}
  if(!best){encFail++;if(encFail>=5){encFail=0;encWaitUntil=Date.now()+30000;encLockDraw()}else encLockDraw('Senha incorreta.');return}
  ENCKEY=best.key;ENCSALT=best.salt;ENCPW=pw;S=norm(best.obj);LOCKEDE=false;ENCBLOBS=[];encFail=0;
  clearInterval(encTick);const l=document.getElementById('lock');if(l)l.remove();document.body.classList.remove('locked');
  rfSync();saveLocal();render();refreshQuotes(false)}
function encWipe(){try{localStorage.removeItem('cf_backup')}catch(e){}
  ENCBLOBS=[];LOCKEDE=false;ENCKEY=null;S=norm(null);encForget=false;
  clearInterval(encTick);const l=document.getElementById('lock');if(l)l.remove();document.body.classList.remove('locked');
  render();toast('Dados apagados. Comece de novo ou restaure um backup.')}
function senhaCard(){const on=pinOn();
  return `<div class="card"><h3>Bloqueio por senha</h3>${on?`<p class="hint" style="margin:0 0 12px">Ativo neste aparelho (${pinLen()} dígitos). O app pede a senha ao abrir e depois de 30 segundos fora dele.</p>
  <div style="display:grid;gap:10px"><label>Senha atual<input id="pinC" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"></label>
  <label>Nova senha (para trocar)<input id="pinN" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="4 a 6 números"></label></div>
  <div class="links" style="margin-top:12px"><button class="sec mini" data-a="lockNow">Bloquear agora</button><button class="sec mini" data-a="pinChange">Trocar senha</button><button class="sec mini danger" data-a="pinOff">Remover</button></div>`
  :`<p class="hint" style="margin:0 0 12px">Peça uma senha numérica para abrir o app neste aparelho. Ela não protege os dados na conta Claude; serve para quem pegar o seu celular desbloqueado.</p>
  <label>Senha (4 a 6 números)<input id="pinN" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"></label><div class="btns" style="margin-top:12px"><button class="pri" data-a="pinOn">Ativar senha</button></div>`}</div>`}
async function pinAct(a){const nv=($('#pinN')||{}).value||'',cv=($('#pinC')||{}).value||'',okN=/^\d{4,6}$/.test(nv);
  if(a==='pinOn'){if(!okN)return toast('Use de 4 a 6 números.');await pinSave(nv);render();toast('Senha ativada.');return}
  if(!(await pinCheck(cv)))return toast('Senha atual incorreta.');
  if(a==='pinChange'){if(!okN)return toast('Nova senha: de 4 a 6 números.');await pinSave(nv);render();toast('Senha trocada.')}
  else{lss(PINK,null);render();toast('Senha removida.')}}

lockShow();
if(LOCKEDE)encLockDraw();
if(!LOCKEDE)rfSync();
render();
setTimeout(()=>{if(!LOCKEDE)refreshQuotes(false)},400);
})();
</script>
