<script>
/* Versão independente: troca os recursos do Claude por recursos do navegador */
window.CF_STANDALONE=true;
(function(){
  const caps={
    artifact:async()=>null,
    downloads:async()=>({save:async({filename,data})=>{
      const b=new Blob([data],{type:/\.json$/i.test(filename)?'application/json':'text/csv;charset=utf-8'});
      const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();
      setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}}),
    mcp:async()=>({callTool:async(server,tool,input)=>{
      if(tool==='TM_Indices_Performance'){
        const r=await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
        if(!r.ok)throw {code:'upstream_error'};
        const j=await r.json(),v=parseFloat(j&&j.USDBRL&&j.USDBRL.bid);
        if(!(v>0))throw {code:'upstream_error'};
        return {payload:{endValue:v}};
      }
      throw {code:'tool_error'};
    }}),
    dictation:async()=>{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
      let rec=null,p=()=>{},f=()=>{},s=()=>{};
      return {onPartial:fn=>{p=fn},onFinal:fn=>{f=fn},onState:fn=>{s=fn},
        start:()=>new Promise((res,rej)=>{
          rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=true;
          rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}if(part)p({text:part});if(fin)f({text:fin})};
          rec.onstart=()=>{s({state:'listening'});res()};
          rec.onend=()=>s({state:'idle'});
          rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')rej({code:'not_granted'});s({state:'idle'})};
          try{rec.start()}catch(e){rej(e)}}),
        stop:()=>{try{rec&&rec.stop()}catch(e){}return Promise.resolve()}};
    }
  };
  window.claude={use:async n=>{try{return caps[n]?await caps[n]():null}catch(e){return null}}};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();

<title>Controle Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
/* Layout: app shell — barra inferior + botão + no celular, menu lateral no computador; saldo em destaque no topo */
:root{
  --bg:#f2f4f8;--surface:#ffffff;--surface2:#eceff5;--tx:#131a2a;--mut:#5b6478;--bd:#e1e5ee;
  --acc:#2f4fd8;--acc-ink:#ffffff;--accbg:#e8ecff;
  --pos:#0f8a5f;--posbg:#e2f4ec;--neg:#cf3a1d;--negbg:#fcebe6;--warn:#a86a10;--warnbg:#fbf1dc;
  --fix:#2f4fd8;--var:#df7414;--card-c:#8a4fd6;
  --hero:#151d3d;--hero-tx:#f3f5ff;--hero-mut:#a7b0d4;--hero-track:rgba(255,255,255,.12);
  --h-fix:#8fa3ff;--h-card:#c9a4ff;--h-var:#ffa457;--h-res:#5fd8ab;--h-neg:#ff8e74;
  --sh:0 1px 2px rgba(21,29,61,.05),0 6px 20px rgba(21,29,61,.06);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a;--surface:#131a2a;--surface2:#1a2235;--tx:#e8ecf7;--mut:#939cb4;--bd:#242c42;
  --acc:#8fa3ff;--acc-ink:#0b0f1a;--accbg:#1d2647;
  --pos:#3fcf94;--posbg:#0f2c22;--neg:#ff7a5c;--negbg:#351a15;--warn:#f2b54a;--warnbg:#33270f;
  --fix:#8fa3ff;--var:#ffa04d;--card-c:#c9a4ff;
  --hero:#1a2452;--hero-track:rgba(255,255,255,.1);--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1a;--surface:#131a2a;--surface2:#1a2235;--tx:#e8ecf7;--mut:#939cb4;--bd:#242c42;
  --acc:#8fa3ff;--acc-ink:#0b0f1a;--accbg:#1d2647;
  --pos:#3fcf94;--posbg:#0f2c22;--neg:#ff7a5c;--negbg:#351a15;--warn:#f2b54a;--warnbg:#33270f;
  --fix:#8fa3ff;--var:#ffa04d;--card-c:#c9a4ff;
  --hero:#1a2452;--hero-track:rgba(255,255,255,.1);--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.a,.hv,.kv-v{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.sm{font-size:12.5px}

/* shell */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-block:14px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--hero-tx);display:grid;place-items:center;flex:none;font:700 15px var(--f-num)}
.brand h1{font:700 17px/1.1 var(--f-num);margin:0;letter-spacing:-.01em}
.status{font-size:11.5px;color:var(--mut);min-height:14px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--bd);border-radius:99px;padding:3px}
.month b{min-width:132px;text-align:center;font-weight:600;font-size:14px}
.month button{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.month button:hover{background:var(--surface2);color:var(--tx)}
.month .today{width:auto;padding:0 12px;border-radius:99px;background:var(--accbg);color:var(--acc);font-size:12.5px;font-weight:600}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:10.5px;font-weight:600;border-radius:12px}
.bnav button.on{color:var(--acc)}
.bnav button.on svg{background:var(--accbg);border-radius:99px;padding:3px 12px;width:48px!important;height:28px!important}
.bnav svg{padding:3px 12px;width:48px!important;height:28px!important}
.fab{position:fixed;z-index:9;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:19px;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}
.fab:active{transform:scale(.96)}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:236px;flex:none;padding:22px 14px;border-right:1px solid var(--bd);background:var(--surface)}
  .side .brand{padding:0 8px 18px}
  .side .nv{border:0;background:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:600;font-size:14px;text-align:left}
  .side .nv:hover{background:var(--surface2);color:var(--tx)}
  .side .nv.on{background:var(--accbg);color:var(--acc)}
  .side .pri{margin:0 0 14px;justify-content:center;padding:11px}
  .bnav,.fab,.top .brand{display:none}
  .top{justify-content:flex-end}
  .main{padding-block:24px 48px}
}

/* buttons */
.btn,.pri,.sec{border:1px solid var(--bd);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--tx)}
.btn:hover,.sec:hover{border-color:var(--acc)}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.pri:hover{filter:brightness(1.07)}
.sec{background:var(--surface2);border-color:transparent}
.danger{color:var(--neg)}
.mini{padding:6px 11px;font-size:12.5px;border-radius:10px}
.icon{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none}
.icon:hover{background:var(--surface2);color:var(--tx)}
.icon.danger:hover{color:var(--neg)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.card h3,.sh{font:600 15px/1.3 var(--f-ui);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:600;color:var(--mut);font-size:13px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.pt{font:700 24px/1.15 var(--f-num);margin:0;letter-spacing:-.015em}
.ps{margin:4px 0 0;color:var(--mut);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.hint{font-size:12.5px;color:var(--mut);margin:10px 0 0}

/* hero */
.hero{background:var(--hero);color:var(--hero-tx);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(143,163,255,.28),transparent 70%);pointer-events:none}
.hl{font-size:13px;color:var(--hero-mut);font-weight:500}
.hv{font:700 clamp(34px,9vw,46px)/1.05 var(--f-num);letter-spacing:-.02em}
.hv.neg{color:var(--h-neg)}
.hs{font-size:13px;color:var(--hero-mut)}
.hs b{color:var(--hero-tx)}
.hs b.neg{color:var(--h-neg)}
.hbar{display:flex;height:12px;border-radius:99px;background:var(--hero-track);overflow:hidden;margin-top:12px;gap:2px}
.hbar i{display:block;height:100%}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--hero-mut);margin-top:4px}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:8px;height:8px;border-radius:3px;display:inline-block}
.hleg b{color:var(--hero-tx);font-weight:600}
.hfoot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hero-track)}
.hfoot span{display:block;font-size:11.5px;color:var(--hero-mut)}
.hfoot b{font:600 15px var(--f-num);font-variant-numeric:tabular-nums}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:759px){.kpis>:last-child:nth-child(odd){grid-column:1/-1}}
@media (min-width:760px){.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;box-shadow:var(--sh)}
button.kpi:hover{border-color:var(--acc)}
.kpi .l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mut)}
.kpi .l i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.kpi .v{font:700 20px/1.2 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--mut)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px}
.bar.lg{height:10px}
.bar i.over{background:var(--neg)}.bar i.warn{background:var(--warn)}.bar i.good{background:var(--pos)}

/* alerts */
.al{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.al:first-of-type{border-top:0;padding-top:0}
.al .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.al.neg .ic{background:var(--negbg);color:var(--neg)}
.al.warn .ic{background:var(--warnbg);color:var(--warn)}
.al p{margin:0;flex:1;min-width:0;font-size:14px;font-weight:500}

/* lists */
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}
.it .n{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;padding:0;text-align:left}
button.n{cursor:pointer}
button.n:hover b{color:var(--acc)}
.it .n b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .n span{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .a{font-weight:700;white-space:nowrap;font-size:14.5px}
.it.done .n b{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.it.done .a{color:var(--mut)}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.tag{display:inline-block;font-size:10.5px;font-style:normal;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-left:6px;vertical-align:1px;text-decoration:none}
.tag.warn{background:var(--warnbg);color:var(--warn)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border-radius:50%;border:2px solid var(--bd);background:var(--surface);display:grid;place-content:center;flex:none;cursor:pointer;transition:background .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:6px;height:11px;border:solid var(--acc-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:var(--pos);border-color:var(--pos)}
input[type=checkbox]:checked::before{transform:rotate(45deg) translate(-1px,-1px) scale(1);border-color:var(--surface)}
input[type=checkbox]:hover{border-color:var(--pos)}
.day+.day{margin-top:14px}
.dh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.kv:first-of-type{border-top:0;padding-top:0}
.kv-v{font-weight:600;white-space:nowrap}
.orc+.orc{margin-top:14px}
.orc-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.orc-h b{font-weight:600}
.orc .sm{margin-top:5px;color:var(--mut)}
.empty{padding:24px 10px;text-align:center;color:var(--mut);font-size:14px}
.big-n{font:700 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}

/* forms */
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--mut);min-width:0}
label.chk{flex-direction:row;align-items:center;gap:10px;font-size:13.5px;font-weight:500;color:var(--tx)}
label.chk input{width:22px;height:22px;border-radius:7px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--surface)}
input:disabled{opacity:.5}
textarea{min-height:150px;resize:vertical;line-height:1.6}
input.big{font:700 34px/1.1 var(--f-num)!important;text-align:center;background:transparent!important;border:0!important;padding:6px 0!important;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg label{display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut)}
.seg input:checked+span{background:var(--surface);color:var(--tx);box-shadow:var(--sh)}
.seg input[value=despesa]:checked+span{color:var(--neg)}
.seg input[value=entrada]:checked+span{color:var(--pos)}
.seg input:focus-visible+span{outline:2px solid var(--acc)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* charts */
.legend{list-style:none;padding:0;margin:0;flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
.chartrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chartrow svg{flex:none;width:140px;height:140px}
.pv{overflow-x:auto;margin:0 -4px}
.pv table{width:100%;border-collapse:collapse;font-size:13px}
.pv td{padding:4px;vertical-align:middle}
.pv thead td{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.pv input,.pv select{padding:7px 8px!important;font-size:13.5px!important}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 0;border-top:1px solid var(--bd);text-align:left}
.menu button:first-child{border-top:0;padding-top:0}
.menu .av{--c:var(--acc)}
.menu b{display:block;font-weight:600}
.menu small{color:var(--mut);font-size:12.5px}

/* modal / sheet */
.modalbg{position:fixed;inset:0;background:rgba(8,12,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fd .18s ease}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.modal::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--bd);margin:0 auto 12px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}

<script id="state" type="application/json">{"rec":[],"tx":[],"pagos":{},"limite":0,"vals":{},"caps":{},"parc":[],"metas":[],"next":1,"v":0,"inv":[],"cot":{"usd":0,"usdData":null,"t":{}},"cats":{"d":[],"e":[]}}</script>
<script id="app-script">
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(o){if(!o||typeof o!=='object')o={};o.rec=o.rec||[];o.tx=o.tx||[];o.pagos=o.pagos||{};o.limite=o.limite||0;o.next=o.next||1;o.v=o.v||0;o.vals=o.vals||{};o.caps=o.caps||{};o.parc=o.parc||[];o.metas=o.metas||[];o.inv=o.inv||[];o.cot=o.cot||{};o.cot.t=o.cot.t||{};o.tema=o.tema||'auto';o.cats=o.cats||{};o.cats.d=o.cats.d||[];o.cats.e=o.cats.e||[];return o}
let S=null;
try{S=JSON.parse($('#state').textContent)}catch(e){}
S=norm(S);
try{const l=JSON.parse(localStorage.getItem('cf_backup')||'null');if(l&&l.v>S.v)S=norm(l)}catch(e){}

const BASE_CD=['Moradia','Contas da casa','Mercado','Transporte','Saúde','Educação','Lazer','Assinaturas','Cartão e dívidas','Outros'];let CD=BASE_CD.slice();

function refreshCats(){CD=BASE_CD.concat(S.cats.d.filter(c=>!BASE_CD.includes(c)));CE=BASE_CE.concat(S.cats.e.filter(c=>!BASE_CE.includes(c)))}
refreshCats();
const PESSOAS=['Casa','Djony','Mariene'];
const PAL=['#3b5bdb','#df7414','#12a383','#9b51e0','#e0457b','#6a9e1f','#1c9fc4','#c99a10','#7b8499','#d23c1f'];
const pad=n=>String(n).padStart(2,'0');
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const today=new Date();
const curM=today.getFullYear()+'-'+pad(today.getMonth()+1);
const todayStr=curM+'-'+pad(today.getDate());
let view=curM,tab='resumo',modal=null,draft=[],draftText='',dic=null,listening=false,dl=null,filt='todos';
try{view=sessionStorage.getItem('cf_view')||curM;tab=sessionStorage.getItem('cf_tab')||'resumo'}catch(e){}
const addM=(m,d)=>{const [y,mo]=m.split('-').map(Number);const dt=new Date(y,mo-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)};
const dim=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const mdiff=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};

const mshort=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};

const opts=(arr,sel)=>arr.map(c=>`<option${c===sel?' selected':''}>${esc(c)}</option>`).join('');
const need=s=>{const v=parseValor(s==null?'':s);return isFinite(v)&&v>0?v:null};
const clampDia=x=>Math.min(31,Math.max(1,+x||1));
const catColor=(c,tipo)=>{if(tipo==='entrada')return 'var(--pos)';const i=CD.indexOf(c);return PAL[(i<0?9:i)%PAL.length]};
const av=(c,tipo)=>`<span class="av" style="--c:${catColor(c,tipo)}">${esc((c||'?').charAt(0))}</span>`;

const IC={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  cl:'<path d="M15 6l-6 6 6 6"/>',cr:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  up:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  text:'<path d="M4 6h16M4 12h11M4 18h7"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  alert:'<path d="M12 3.5l9 16h-18l9-16z"/><path d="M12 10v4M12 17v.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  pin:'<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  cam:'<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

function parseValor(s){
  s=String(s).replace(/R\$|\s/gi,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;
}

/* ---------- tags, extrato e categorias ---------- */
const parseTags=s=>[...new Set(String(s||'').split(/[,;\s]+/).map(x=>x.replace(/^#/,'').trim().toLowerCase()).filter(Boolean))].slice(0,8);
const tagsHtml=a=>(a||[]).map(t=>`<i class="tag">#${esc(t)}</i>`).join('');
function allTags(){const m={};const add=a=>(a||[]).forEach(t=>m[t]=(m[t]||0)+1);S.tx.forEach(t=>add(t.tags));S.rec.forEach(t=>add(t.tags));S.parc.forEach(t=>add(t.tags));return m}
const tagField=v=>`<label class="full">Tags (opcional)<input name="tags" list="tgl" placeholder="ex.: viagem, presente" value="${esc((v||[]).join(', '))}" autocomplete="off"></label><datalist id="tgl">${Object.keys(allTags()).sort().map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>`;
let ef={tipo:'todos',cat:'',tag:'',quem:'',q:''};
function extratoItems(m){
  const d=monthData(m),out=[];
  d.rec.filter(r=>!r.orc).forEach(r=>out.push({k:'rec',id:r.id,dia:r.dia,nome:r.nome,valor:recVal(r,m),tipo:r.tipo,cat:r.cat,tags:r.tags||[],quem:'Casa',src:'Conta fixa · dia '+r.dia}));
  d.parc.forEach(x=>out.push({k:'parc',id:x.p.id,dia:x.p.dia||10,nome:x.p.nome+' ('+x.k+'/'+x.p.n+')',valor:x.valor,tipo:'despesa',cat:x.p.cat,tags:x.p.tags||[],quem:x.p.quem||'Casa',src:'Cartão · dia '+(x.p.dia||10)}));
  d.tx.forEach(t=>out.push({k:'tx',id:t.id,dia:+t.data.slice(8),nome:t.nome,valor:t.valor,tipo:t.tipo,cat:t.cat,tags:t.tags||[],quem:t.quem||'Casa',src:(t.tipo==='entrada'?'Entrada':'Gasto')+' · dia '+t.data.slice(8)}));
  return out.sort((a,b)=>b.dia-a.dia||a.nome.localeCompare(b.nome));
}
function exFilter(it){const q=ef.q.trim().toLowerCase();return it.filter(x=>(ef.tipo==='todos'||x.tipo===ef.tipo)&&(!ef.cat||x.cat===ef.cat)&&(!ef.tag||x.tags.includes(ef.tag))&&(!ef.quem||x.quem===ef.quem)&&(!q||(x.nome+' '+x.cat+' '+x.tags.join(' ')).toLowerCase().includes(q)))}
function exBody(){
  const L=exFilter(extratoItems(view));
  const sd=L.filter(x=>x.tipo==='despesa').reduce((s,x)=>s+x.valor,0),se=L.filter(x=>x.tipo==='entrada').reduce((s,x)=>s+x.valor,0);
  const rows=L.map(x=>{const body=`<b>${esc(x.nome)}${tagsHtml(x.tags)}</b><span>${esc(x.cat)} · ${esc(x.src)}${x.quem!=='Casa'?' · '+esc(x.quem):''}</span>`;
    const nm=x.k==='tx'?`<button class="n" data-a="open" data-m="editTx" data-id="${x.id}">${body}</button>`:x.k==='rec'?`<button class="n" data-a="open" data-m="recMenu" data-id="${x.id}">${body}</button>`:`<div class="n">${body}</div>`;
    return `<div class="it">${av(x.cat,x.tipo)}${nm}<div class="a ${x.tipo==='entrada'?'pos':''}">${x.tipo==='entrada'?'+':'−'} ${brl(x.valor)}</div></div>`}).join('');
  return `<div class="kpis">${kpi('Despesas','var(--var)',brl(sd),L.filter(x=>x.tipo==='despesa').length+' itens',null)}${kpi('Entradas','var(--pos)',brl(se),L.filter(x=>x.tipo==='entrada').length+' itens',null)}</div><div class="card" style="margin-top:14px"><h3>Resultado <small>${L.length} ${L.length===1?'item':'itens'}</small></h3>${rows||'<div class="empty">Nada encontrado com esses filtros.</div>'}</div>`;
}
function vExtrato(){
  const items=extratoItems(view),tags=Object.keys(allTags()).sort(),cats=[...new Set(CD.concat(CE,items.map(x=>x.cat),ef.cat?[ef.cat]:[]))],qs=[...new Set(PESSOAS.concat(items.map(x=>x.quem)))];
  const sel=(k,label,arr)=>`<label>${label}<select data-ef="${k}"><option value="">Todas</option>${arr.map(c=>`<option${ef[k]===c?' selected':''}>${esc(c)}</option>`).join('')}</select></label>`;
  return pageHead('Extrato e filtros',`Tudo de ${esc(mname(view))}: contas fixas, cartão e lançamentos`)+
  `<div class="card"><div class="chips" style="margin-bottom:12px">${[['todos','Tudo'],['despesa','Despesas'],['entrada','Entradas']].map(([v,l])=>`<button class="chip ${ef.tipo===v?'on':''}" data-a="eftipo" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="capgrid">${sel('cat','Categoria',cats)}${sel('tag','Tag',tags)}${sel('quem','Quem',qs)}<label>Buscar<input id="exq" value="${esc(ef.q)}" placeholder="descrição, categoria, tag" autocomplete="off"></label></div>
  <div class="btns" style="margin-top:12px"><button class="sec mini" data-a="efclear">Limpar filtros</button><button class="sec mini" data-a="tab" data-t="cats">Categorias e tags</button></div>
  <p class="hint">Orçamentos fixos não entram aqui: o gasto real aparece nos lançamentos.</p></div><div id="exbody">${exBody()}</div>`;
}
function vCats(){
  const mk=(k,l,base,extra)=>`<div class="card"><h3>${l}</h3><div class="chips">${base.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}${extra.map(c=>`<span class="chip on" style="display:inline-flex;align-items:center;gap:6px">${esc(c)}<button class="icon" style="width:20px;height:20px;color:inherit" data-a="delCat" data-t="${k}" data-n="${esc(c)}" aria-label="Remover ${esc(c)}">${ic('x',13)}</button></span>`).join('')}</div>
    <form class="f" data-f="addCat" data-t="${k}" style="grid-template-columns:1fr auto;align-items:end;margin-top:14px"><label>Nova categoria<input name="nome" placeholder="ex.: Pets, Presentes" autocomplete="off" required></label><button class="sec" type="submit" style="height:44px">Criar</button></form></div>`;
  const tg=Object.entries(allTags()).sort((a,b)=>b[1]-a[1]);

  `<div class="grid2">${mk('d','Categorias de despesa',BASE_CD,S.cats.d)}${mk('e','Categorias de entrada',BASE_CE,S.cats.e)}</div>`+
  `<div class="card"><h3>Tags em uso <small>${tg.length}</small></h3>${tg.length?tg.map(([k,n])=>`<div class="kv"><span><button class="chip" data-a="tagFilter" data-n="${esc(k)}">#${esc(k)}</button> <span class="mut sm">${n} ${n===1?'item':'itens'}</span></span><button class="icon danger" data-a="delTag" data-n="${esc(k)}" aria-label="Remover tag ${esc(k)}">${ic('trash',16)}</button></div>`).join(''):'<div class="empty">Nenhuma tag ainda. Digite no campo “Tags” ao lançar uma despesa ou entrada.</div>'}<p class="hint">Remover uma categoria só tira da lista de escolhas; lançamentos antigos mantêm o nome.</p></div>`;
}
function vTagsCard(d){
  const m={};extratoItems(view).filter(x=>x.tipo==='despesa').forEach(x=>x.tags.forEach(t=>m[t]=(m[t]||0)+x.valor));

}

/* ---------- cálculo ---------- */
function recAtiva(m){return S.rec.filter(r=>r.ini<=m&&(!r.fim||r.fim>=m)).sort((a,b)=>a.dia-b.dia)}
const recVal=(r,m)=>{const o=(S.vals[m]||{})[r.id];return o===undefined?(r.usd>0&&S.cot.usd>0?Math.round(r.usd*S.cot.usd*100)/100:r.valor):o};
function conv(fd,v){if(fd.usd!=='on')return {valor:v};if(!(S.cot.usd>0)){toast('Sem cotação do dólar. Toque no dólar no topo ou informe em Investir.');return null}return {valor:Math.round(v*S.cot.usd*100)/100,usd:v,taxa:S.cot.usd}}
const usdTag=x=>x&&x.usd>0?`<i class="tag">US$ ${x.usd.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</i>`:'';
const parcVal=(p,k)=>{const b=Math.round(p.total/p.n*100)/100;return k<p.n?b:Math.round((p.total-b*(p.n-1))*100)/100};
function parcDoMes(m){const out=[];S.parc.forEach(p=>{const k=mdiff(p.ini,m)+1;if(k>=1&&k<=p.n)out.push({p,k,valor:parcVal(p,k)})});return out}
function metasDoMes(m){return S.metas.filter(g=>g.mensal>0&&g.ini<=m)}
function guardado(g){return g.base+Object.keys(S.pagos).filter(m=>S.pagos[m]&&S.pagos[m]['m'+g.id]).length*g.mensal}

function monthData(m){
  const rec=recAtiva(m),tx=S.tx.filter(t=>t.data.startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data));
  const pg=S.pagos[m]||{},parc=parcDoMes(m),metas=metasDoMes(m);
  let entPrev=0,entReal=0,fixPrev=0,fixReal=0,cartPrev=0,cartReal=0,metaPrev=0,metaReal=0,vr=0;
  const cats={},orcs=[],claimed={},porQuem={};
  const orcCats=new Set(rec.filter(r=>r.orc&&r.tipo==='despesa').map(r=>r.cat));
  const catSpent=c=>tx.filter(t=>t.tipo==='despesa'&&t.cat===c).reduce((s,t)=>s+t.valor,0);
  rec.forEach(r=>{const v=recVal(r,m),done=!!pg[r.id];
    if(r.tipo==='entrada'){entPrev+=v;if(done)entReal+=v}
    else if(r.orc){const sp=claimed[r.cat]?0:catSpent(r.cat);claimed[r.cat]=true;const used=Math.min(sp,v),extra=Math.max(0,sp-v);fixPrev+=v;fixReal+=used;vr+=extra;cats[r.cat]=(cats[r.cat]||0)+v+extra;orcs.push({r,v,spent:sp,left:v-sp,extra})}
    else{fixPrev+=v;if(done)fixReal+=v;cats[r.cat]=(cats[r.cat]||0)+v}});
  parc.forEach(x=>{cartPrev+=x.valor;if(pg['p'+x.p.id])cartReal+=x.valor;cats[x.p.cat]=(cats[x.p.cat]||0)+x.valor;const q=x.p.quem||'Casa';porQuem[q]=(porQuem[q]||0)+x.valor});
  metas.forEach(g=>{metaPrev+=g.mensal;if(pg['m'+g.id])metaReal+=g.mensal});
  tx.forEach(t=>{if(t.tipo==='entrada'){entPrev+=t.valor;entReal+=t.valor}
    else{const q=t.quem||'Casa';porQuem[q]=(porQuem[q]||0)+t.valor;
      if(!orcCats.has(t.cat)){vr+=t.valor;cats[t.cat]=(cats[t.cat]||0)+t.valor}}});
  const gasto=fixPrev+cartPrev+vr;
  return {rec,tx,pg,parc,metas,orcs,orcCats,entPrev,entReal,fixPrev,fixReal,cartPrev,cartReal,metaPrev,metaReal,vr,cats,porQuem,gasto,
    saldoPrev:entPrev-gasto-metaPrev,saldoAtual:entReal-fixReal-cartReal-vr-metaReal};
}

/* ---------- cotações automáticas ---------- */
const MCP='Minhas Economias';
let qbusy=false;
const FATAL=['needs_reauth','approval_required','declined','blocked_by_policy','not_in_manifest','server_not_connected'];
const qErr=e=>{const c=e&&e.code;return c==='needs_reauth'?'Reconecte o conector Minhas Economias no claude.ai.':c==='server_not_connected'?'O conector Minhas Economias não está conectado.':(c==='approval_required'||c==='declined')?'Autorize o acesso às cotações para atualizar sozinho.':(c==='blocked_by_policy'||c==='not_in_manifest')?'Acesso às cotações bloqueado neste app.':(c==='server_unavailable'||c==='upstream_error')?'Serviço de cotações indisponível agora.':'Não consegui buscar algumas cotações.'};
const qPayload=r=>{let p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}if(p&&p.result&&typeof p.result==='object'&&!Array.isArray(p.result))p=p.result;return p};
async function fetchUsd(m){
  const d=new Date(Date.now()-7*864e5),ds=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  const p=qPayload(await m.callTool(MCP,'TM_Indices_Performance',{cdIndex:1,dtStart:ds,dtEnd:0}));
  const v=p&&+p.endValue;return v>0?v:null;
}
async function fetchPx(m,tk){
  const p=qPayload(await m.callTool(MCP,'RT_CotacaoHistoricoPreco',{cd_stock:tk,id_exchange:1,group_method:'MINUTE',group_factor:1,id_point:0,limit:3,direction:'desc'}));
  const vs=p&&p.vl_close,ts=p&&p.id_point;if(!Array.isArray(vs)||!vs.length)return null;
  let bi=0;if(Array.isArray(ts))ts.forEach((t,i)=>{if(t>ts[bi])bi=i});
  const v=+vs[bi],t=Array.isArray(ts)?+ts[bi]:0;if(!(v>0))return null;
  const dt=t>0?new Date(t):new Date(),ds=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  return {v:Math.round(v*1e4)/1e4,d:ds};
}
const usdN=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3});
const usdChip=()=>{const u=S.cot.usd;return `<button class="usdchip" data-a="qrefresh" title="Atualizar cotações"><b>Dólar</b> ${u?'R$ '+usdN(u):'—'} <small>${qbusy?'atualizando…':u?(S.cot.usdData===todayStr?'hoje':'de '+dmy(S.cot.usdData)):'toque'}</small></button>`};
function patchChip(){const el=$('.usdchip');if(el)el.outerHTML=usdChip()}
function persistQuiet(){S.v=Date.now();try{localStorage.setItem('cf_backup',JSON.stringify(S))}catch(e){}clearTimeout(timer);setStatus('Salvando…');timer=setTimeout(doPublish,1200)}
async function refreshQuotes(manual){
  if(qbusy)return;
  let m=null;try{m=window.claude&&window.claude.use?await window.claude.use('mcp'):null}catch(e){m=null}
  if(!m){if(manual)toast('Cotação automática indisponível aqui. Informe os valores à mão.');return}
  qbusy=true;patchChip();
  const tks=window.CF_STANDALONE?[]:[...new Set(S.inv.filter(i=>i.tipo==='acao').map(i=>tick(i.nome)))];
  let ch=false,err=null,ok=0;
  try{const u=await fetchUsd(m);if(u){ok++;if(u!==S.cot.usd||S.cot.usdData!==todayStr){S.cot.usd=u;S.cot.usdData=todayStr;ch=true}}else err=err||{code:'x'}}catch(e){err=e||{code:'x'}}
  if(!(err&&FATAL.includes(err.code))){
    const rs=await Promise.all(tks.map(async t=>{try{return [t,await fetchPx(m,t),null]}catch(e){return [t,null,e||{code:'x'}]}}));
    rs.forEach(([t,q,e])=>{if(q){ok++;const o=S.cot.t[t];if(!o||o.v!==q.v||o.d!==q.d){S.cot.t[t]=q;ch=true}}else err=err||e||{code:'x'}});
  }
  qbusy=false;
  if(ch)persistQuiet();
  if(modal||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||''))patchChip();else render();
  if(err)toast(qErr(err));else if(manual)toast('Cotações atualizadas.');
}

  d.parc.forEach(x=>rows.push([m,'Cartão '+x.k+'/'+x.p.n,x.p.nome,x.p.cat,x.p.quem||'Casa',String(x.p.dia||10),x.valor,d.pg['p'+x.p.id]?'pago':'a pagar']));

function toCSV(rows){

  return '﻿'+[head].concat(rows).map(r=>r.map(c=>{const s=typeof c==='number'?c.toFixed(2).replace('.',','):String(c);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n');

function allMonths(){
  let a=curM,b=curM;
  S.rec.forEach(r=>{if(r.ini<a)a=r.ini});
  S.tx.forEach(t=>{const m=t.data.slice(0,7);if(m<a)a=m;if(m>b)b=m});

/* ---------- gráficos ---------- */
function donut(cats){
  const ent=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const tot=ent.reduce((s,e)=>s+e[1],0);
  if(!tot)return '<div class="empty">Sem despesas neste mês.</div>';
  const R=72,r=50,cx=80,cy=80;let a0=-Math.PI/2,paths='';
  const p=(a,rad)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
  const col=k=>catColor(k,'despesa');
  ent.forEach(([k,v])=>{
    const f=v/tot,a1=a0+f*2*Math.PI,c=col(k);
    if(f>0.9999)paths+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${c}" stroke-width="${R-r}"><title>${esc(k)}</title></circle>`;
    else{const lg=f>.5?1:0;const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
      paths+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${c}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(k)}: ${brl(v)}</title></path>`}
    a0=a1;
  });
  paths+=`<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="var(--f-ui)">total</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="var(--tx)" font-family="var(--f-num)">${esc(brl(tot).replace(/,\d\d$/,''))}</text>`;
  const leg=ent.map(([k,v])=>`<li><i style="background:${col(k)}"></i><span>${esc(k)}</span><em>${brl(v)} · ${Math.round(v/tot*100)}%</em></li>`).join('');
  return `<div class="chartrow"><svg viewBox="0 0 160 160" role="img" aria-label="Despesas por categoria">${paths}</svg><ul class="legend">${leg}</ul></div>`;
}
function bars(){

/* ---------- interpretação do texto ditado ---------- */
const CATMAP=[[/alug|condom|iptu|financiamento im|reforma/,'Moradia'],[/luz|energia|[aá]gua|\bg[aá]s\b|internet|telefone|celular|wi-?fi|tv a cabo/,'Contas da casa'],[/mercado|supermercado|feira|padaria|a[cç]ougue|comida|restaurante|lanche|ifood/,'Mercado'],[/combust|gasolina|[oô]nibus|metr[oô]|uber|99|ped[aá]gio|carro|moto|estacionamento|ipva|seguro auto/,'Transporte'],[/m[eé]dic|farm[aá]cia|plano de sa|sa[uú]de|dentista|academia|terapia|psic/,'Saúde'],[/escola|faculdade|curso|mensalidade|livro/,'Educação'],[/cinema|viagem|lazer|bar|show|jogo|passeio/,'Lazer'],[/netflix|spotify|assinatura|prime|disney|youtube|streaming/,'Assinaturas'],[/cart[aã]o|fatura|empr[eé]stimo|d[ií]vida|parcela|consignado/,'Cartão e dívidas']];
function guessCat(nome,entrada){
  const n=nome.toLowerCase();
  if(entrada)return /sal[aá]rio|pagamento|holerite/.test(n)?'Salário':/freela|extra|bico|venda/.test(n)?'Extra / freela':/rendimento|dividendo|juros|aluguel recebido/.test(n)?'Rendimentos':'Outros';
  for(const [re,c] of CATMAP)if(re.test(n))return c;return 'Outros';
}
function parseLinha(l){
  let t=l.trim();if(!t)return null;let low=t.toLowerCase();
  const tg=[...low.matchAll(/#([^\s#,;]+)/g)].map(m=>m[1]);low=low.replace(/#[^\s#,;]+/g,' ');
  let dia=null;const md=low.match(/\bdia\s+(\d{1,2})\b/);
  if(md){dia=Math.min(31,Math.max(1,+md[1]));low=low.replace(md[0],' ')}
  let quem='Casa';const mq=low.match(/\b(djony|mariene)\b/);
  if(mq){quem=mq[1].charAt(0).toUpperCase()+mq[1].slice(1);low=low.replace(mq[0],' ')}
  let n=null;const mn=low.match(/\b(?:em\s+)?(\d{1,2})\s*x\b/)||low.match(/\bparcelad[oa]s?\s+(?:em\s+)?(\d{1,2})\b/);
  if(mn){n=Math.min(48,Math.max(1,+mn[1]));low=low.replace(mn[0],' ')}
  const cartao=/\bcart[aã]o\b/.test(low);
  const mv=low.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  if(!mv)return null;
  const valor=parseValor(mv[1]);if(!isFinite(valor)||valor<=0)return null;
  const entrada=/\b(entrada|receita|recebi|recebo|sal[aá]rio|renda|freela|freelance|rendimento)\b/.test(low);
  let fixa=/\b(fix[ao]s?|mensal|todo\s+m[eê]s)\b/.test(low);
  const varia=/\bvari[aá]ve(l|is)\b/.test(low);
  if(varia)fixa=false;else if(!fixa&&/sal[aá]rio/.test(low))fixa=true;
  let nome=low.replace(mv[0],' ').replace(/r\$|\breais\b|\breal\b|\b(fix[ao]s?|vari[aá]ve(l|is)|entrada|receita|mensal|recebi|recebo|todo\s+m[eê]s|cart[aã]o|parcelad[oa]s?)\b/g,' ')
    .replace(/[:;,\-–=]/g,' ').replace(/\b(de|do|da|em|no|na|é|são|foi|uma|um|a|o)\b(?=\s*$)/g,' ').replace(/^\s*(de|do|da|é|são)\s+/,'').replace(/\s+/g,' ').trim();
  nome=nome?nome.charAt(0).toUpperCase()+nome.slice(1):'Sem descrição';
  let kind=entrada?(fixa?'ef':'ev'):(fixa?'df':'dv');
  if(!entrada&&!fixa&&(n||cartao)){kind='cc';n=n||1}
  return {nome,valor,kind,cat:guessCat(nome,entrada),dia,quem,n,tags:parseTags(tg.join(','))};
}

/* ---------- ações ---------- */
function newId(){return S.next++}
function defDay(){return view===curM?today.getDate():1}
function addDraftItems(items){
  items.forEach(r=>{
    const [,tipo,fixa]=KINDS[r.kind];
    if(r.kind==='cc'){S.parc.push({id:newId(),nome:r.nome,total:r.valor,n:Math.min(48,Math.max(1,+r.n||1)),ini:view,dia:r.dia?clampDia(r.dia):10,cat:r.cat,quem:r.quem||'Casa',tags:r.tags||[]});return}
    const dia=r.dia?clampDia(r.dia):(fixa?1:defDay());
    if(fixa)S.rec.push({id:newId(),nome:r.nome,valor:r.valor,tipo,cat:r.cat,dia,ini:view,fim:null,tags:r.tags||[]});
    else S.tx.push({id:newId(),data:view+'-'+pad(Math.min(dia,dim(view))),nome:r.nome,valor:r.valor,tipo,cat:r.cat,quem:r.quem||'Casa',tags:r.tags||[]});
  });
}

    case 'parse':{
      const txt=($('#dtxt')||{}).value||'';draftText=txt;
      const items=txt.split(/\n|;/).map(parseLinha).filter(Boolean);
      const skipped=txt.split(/\n|;/).filter(l=>l.trim()).length-items.length;
      draft=items;renderPreview();
      if(!items.length)toast('Não encontrei nenhum valor no texto.');
      else if(skipped>0)toast(skipped+' linha(s) sem valor foram ignoradas.');
      break}
    case 'rmDraft':draft.splice(+el.dataset.i,1);renderPreview();break;
    case 'clearDraft':draft=[];draftText='';render();break;
    case 'addAll':{
      const ok=draft.filter(r=>r.nome&&r.valor>0);
      addDraftItems(ok);draft=[];draftText='';tab='resumo';persistView();commit();toast(ok.length+' itens adicionados.');break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.name==='itipo'){el.closest('form').dataset.t=el.value;return}
  if(el.name==='oper'){el.closest('form').dataset.o=el.value;return}
  if(el.dataset&&el.dataset.cot!==undefined){const k=el.dataset.cot,v=numP(el.value);
    if(k==='USD'){if(v>0){S.cot.usd=v;S.cot.usdData=todayStr}else{S.cot.usd=0;S.cot.usdData=null}}
    else{if(v>0)S.cot.t[k]={v,d:todayStr};else delete S.cot.t[k]}
    commit();toast('Cotação atualizada.');return}
  if(el.id==='fotoin'){const f=el.files&&el.files[0];if(!f||!AS)return;pend.busy=true;toast('Enviando foto…');
    (async()=>{try{let b;try{b=await shrink(f)}catch(x){b=f}const r=await AS.upload(b);pend.foto=r.id;toast('Foto anexada.')}catch(x){toast('Não consegui enviar a foto.')}pend.busy=false;paintAnx()})();return}
  if(el.dataset&&el.dataset.ef){ef[el.dataset.ef]=el.value;render();return}
  if(el.id==='lim'){const v=parseValor(el.value);S.limite=isFinite(v)?v:0;commit();return}
  if(el.id==='restore'){
    const f=el.files&&el.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!Array.isArray(o.rec)||!Array.isArray(o.tx))throw 0;S=norm(o);S.v=Date.now();commit();toast('Backup restaurado.')}catch(err){toast('Arquivo de backup inválido.')}};
    rd.readAsText(f);return}
  if(el.dataset&&el.dataset.cap!==undefined){const v=parseValor(el.value);if(isFinite(v)&&v>0)S.caps[el.dataset.cap]=v;else delete S.caps[el.dataset.cap];commit();return}
  if(el.dataset&&el.dataset.catsel){const f=el.closest('form');const c=f.querySelector('[name=cat]');c.innerHTML=opts(catsOf(el.value));return}
  if(el.dataset&&el.dataset.a==='toggle'){
    const k=el.dataset.k;const m=S.pagos[view]=S.pagos[view]||{};
    if(el.checked)m[k]=true;else delete m[k];commit();return}
  if(el.dataset&&el.dataset.d!==undefined){
    const r=draft[+el.dataset.d],k=el.dataset.k;if(!r)return;
    if(k==='valor'){const v=parseValor(el.value);if(isFinite(v))r.valor=v}
    else if(k==='dia')r.dia=el.value?+el.value:null;
    else if(k==='n')r.n=Math.min(48,Math.max(1,+el.value||1));
    else if(k==='kind'){r.kind=el.value;r.cat=guessCat(r.nome,KINDS[r.kind][1]==='entrada');if(r.kind==='cc'&&!r.n)r.n=1;renderPreview()}
    else r[k]=el.value;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='dtxt')draftText=e.target.value;if(e.target.id==='exq'){ef.q=e.target.value;const b=$('#exbody');if(b)b.innerHTML=exBody()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());
  const bad=()=>toast('Informe um valor válido.');
  switch(f.dataset.f){
    case 'addTx':{const valor=need(fd.valor);if(valor==null)return bad();
      if(pend.busy)return toast('Aguarde o envio da foto.');const cv=conv(fd,valor);if(!cv)return;S.tx.push({id:newId(),data:fd.data,nome:fd.nome.trim(),valor:cv.valor,usd:cv.usd,taxa:cv.taxa,foto:pend.foto||undefined,loc:pend.loc||undefined,local:(fd.local||'').trim()||undefined,tipo:fd.tipo,cat:fd.cat,quem:fd.quem||'Casa',tags:parseTags(fd.tags)});view=fd.data.slice(0,7);modal=null;persistView();commit();toast((fd.tipo==='entrada'?'Entrada':'Gasto')+' de '+brl(valor)+' lançado.');break}
    case 'editTx':{const t=S.tx.find(x=>x.id===modal.id);if(!t)break;const valor=need(fd.valor);if(valor==null)return bad();
      if(pend.busy)return toast('Aguarde o envio da foto.');Object.assign(t,{nome:fd.nome.trim(),valor,cat:fd.cat,data:fd.data,quem:fd.quem||'Casa',tags:parseTags(fd.tags),foto:pend.foto||undefined,loc:pend.loc||undefined,local:(fd.local||'').trim()||undefined});view=fd.data.slice(0,7);modal=null;persistView();commit();toast('Lançamento atualizado.');break}
    case 'addCat':{const k=f.dataset.t,nome=(fd.nome||'').trim().slice(0,30);if(!nome)return;const base=k==='d'?BASE_CD:BASE_CE;
      if(base.concat(S.cats[k]).some(c=>c.toLowerCase()===nome.toLowerCase()))return toast('Essa categoria já existe.');S.cats[k].push(nome);commit();toast('Categoria criada.');break}
    case 'addRec':{const valor=need(fd.valor);if(valor==null)return bad();const dep=fd.tipo==='despesa';
      const cv=conv(fd,valor);if(!cv)return;S.rec.push({id:newId(),nome:fd.nome.trim(),valor:cv.valor,usd:cv.usd,tipo:fd.tipo,cat:fd.cat,dia:clampDia(fd.dia),ini:view,fim:null,orc:dep&&fd.orc==='on',estim:dep&&fd.estim==='on',tags:parseTags(fd.tags)});modal=null;commit();toast('Conta fixa adicionada.');break}
    case 'editRec':{
      const r=S.rec.find(x=>x.id===modal.id);if(!r)break;
      const valor=need(fd.valor);if(valor==null)return bad();
      const dep=r.tipo==='despesa';
      const ch={nome:fd.nome.trim(),valor,dia:clampDia(fd.dia),cat:fd.cat,orc:dep&&fd.orc==='on',estim:dep&&fd.estim==='on',tags:parseTags(fd.tags)};
      if(r.usd>0){ch.usd=valor;ch.valor=Math.round(valor*(S.cot.usd>0?S.cot.usd:r.valor/r.usd)*100)/100}
      if(r.ini===view)Object.assign(r,ch);
      else{const prev=addM(view,-1),old={...r},nid=newId();r.fim=prev;S.rec.push({...old,...ch,id:nid,ini:view,fim:old.fim||null});
        Object.keys(S.vals).forEach(m=>{if(m>=view&&S.vals[m][old.id]!==undefined){S.vals[m][nid]=S.vals[m][old.id];delete S.vals[m][old.id]}});
        Object.keys(S.pagos).forEach(m=>{if(m>=view&&S.pagos[m][old.id]){S.pagos[m][nid]=true;delete S.pagos[m][old.id]}})}
      modal=null;commit();break}
    case 'monthVal':{const valor=need(fd.valor);if(valor==null)return bad();
      (S.vals[view]=S.vals[view]||{})[modal.id]=valor;modal=null;commit();break}
    case 'addParc':{const total=need(fd.valor);if(total==null)return bad();
      const n=Math.min(48,Math.max(1,parseInt(fd.n,10)||1));const ini=/^\d{4}-\d{2}$/.test(fd.ini||'')?fd.ini:view;
      const cv=conv(fd,total);if(!cv)return;S.parc.push({id:newId(),nome:fd.nome.trim(),total:cv.valor,usd:cv.usd,taxa:cv.taxa,n,ini,dia:clampDia(fd.dia),cat:fd.cat,quem:fd.quem||'Casa',tags:parseTags(fd.tags)});modal=null;commit();toast('Compra adicionada.');break}
    case 'addMeta':{const alvo=need(fd.alvo);if(alvo==null)return bad();
      const b=parseValor(fd.base||''),m=parseValor(fd.mensal||'');
      S.metas.push({id:newId(),nome:fd.nome.trim(),alvo,base:isFinite(b)&&b>0?b:0,mensal:isFinite(m)&&m>0?m:0,ini:view});modal=null;commit();toast('Meta criada.');break}
    case 'addInv':{const t=f.dataset.t,nome=(fd.nome||'').trim(),inst=(fd.inst||'').trim();
      if(!nome)return toast('Informe o nome ou código da aplicação.');
      const it={id:newId(),tipo:t,nome:t==='acao'?tick(nome):nome,inst,criado:todayStr,realizado:0};
      if(t==='acao'){const q=numQ(fd.qtd),pm=numP(fd.pm);if(!(q>0)||!(pm>0))return toast('Informe a quantidade e o preço médio.');Object.assign(it,{qtd:q,pm});const c=numP(fd.cotA);if(c>0)S.cot.t[it.nome]={v:c,d:todayStr}}
      else if(t==='usd'){const u=numP(fd.usd),dm=numP(fd.dm);if(!(u>0)||!(dm>0))return toast('Informe o saldo em US$ e o dólar médio pago.');Object.assign(it,{usd:u,dm});const c=numP(fd.cotU);if(c>0&&c!==S.cot.usd){S.cot.usd=c;S.cot.usdData=todayStr}}
      else{const a=need(fd.aplicado);if(a==null)return toast('Informe o valor aplicado.');const at=parseValor(fd.atual||'');Object.assign(it,{aplicado:a,atual:isFinite(at)&&at>0?at:a,atualData:todayStr,venc:t==='rf'&&fd.venc?fd.venc:null})}
      S.inv.push(it);modal=null;tab='inv';persistView();commit();toast('Aplicação adicionada.');break}
    case 'invOp':{const i=S.inv.find(x=>x.id===modal.id);if(!i)break;const o=f.dataset.o;
      if(i.tipo==='acao'||i.tipo==='usd'){const k=i.tipo==='acao'?'qtd':'usd',mk=i.tipo==='acao'?'pm':'dm';
        const q=i.tipo==='acao'?numQ(fd.q):numP(fd.q),pr=numP(fd.p);
        if(!(q>0)||!(pr>0))return toast(i.tipo==='acao'?'Informe a quantidade e o preço.':'Informe o valor em US$ e a cotação.');
        if(o==='in'){i[mk]=Math.round((i[k]*i[mk]+q*pr)/(i[k]+q)*1e6)/1e6;i[k]=+(i[k]+q).toFixed(8);modal=null;commit();toast('Compra registrada. Novo médio: '+brlN(i[mk])+'.')}
        else{if(q>i[k]+1e-9)return toast('Valor maior que o saldo da aplicação.');const g=q*(pr-i[mk]);i.realizado=(i.realizado||0)+g;i[k]=+(i[k]-q).toFixed(8);modal=null;commit();toast('Venda registrada. Resultado '+sgn(g)+'.')}
      }else{
        if(o==='upd'){const v=parseValor(fd.s||'');if(!(isFinite(v)&&v>=0))return toast('Informe o saldo atual.');i.atual=v;i.atualData=todayStr;modal=null;commit();toast('Saldo atualizado.')}
        else{const v=need(fd.v);if(v==null)return toast('Informe o valor.');
          if(o==='in'){i.aplicado=Math.round((i.aplicado+v)*100)/100;i.atual=Math.round((i.atual+v)*100)/100;modal=null;commit();toast('Aporte registrado.')}
          else{if(v>i.atual+0.004)return toast('Valor maior que o saldo atual.');const fr=i.atual?v/i.atual:1,g=v-i.aplicado*fr;i.realizado=(i.realizado||0)+g;i.aplicado=Math.round(i.aplicado*(1-fr)*100)/100;i.atual=Math.round((i.atual-v)*100)/100;modal=null;commit();toast('Resgate registrado. Rendimento '+sgn(g)+'.')}}
      }break}
    case 'editInv':{const i=S.inv.find(x=>x.id===modal.id);if(!i)break;const nome=(fd.nome||'').trim();if(!nome)return toast('Informe o nome.');
      const oldT=tick(i.nome);i.nome=i.tipo==='acao'?tick(nome):nome;i.inst=(fd.inst||'').trim();
      if(i.tipo==='acao'){const q=numQ(fd.qtd),pm=numP(fd.pm);if(!(q>=0)||!(pm>0))return toast('Confira quantidade e preço médio.');i.qtd=q;i.pm=pm;if(oldT!==i.nome&&S.cot.t[oldT]&&!S.inv.some(x=>x!==i&&x.tipo==='acao'&&tick(x.nome)===oldT)){S.cot.t[i.nome]=S.cot.t[i.nome]||S.cot.t[oldT];delete S.cot.t[oldT]}}
      else if(i.tipo==='usd'){const u=numP(fd.usd),dm=numP(fd.dm);if(!(u>=0)||!(dm>0))return toast('Confira saldo e dólar médio.');i.usd=u;i.dm=dm}
      else{const a=parseValor(fd.aplicado||''),at=parseValor(fd.atual||'');if(!(a>=0)||!(at>=0))return toast('Confira os valores.');i.aplicado=a;i.atual=at;if(i.tipo==='rf')i.venc=fd.venc||null}
      modal=null;commit();toast('Aplicação atualizada.');break}
    case 'metaAdd':{const valor=need(fd.valor);if(valor==null)return bad();
      const g=S.metas.find(x=>x.id===+f.dataset.id);if(g){g.base+=valor;commit();toast('Valor guardado.')}break}
  }
});

/* ---------- capacidades (voz e download) ---------- */
(async()=>{
  try{
    dic=window.claude&&window.claude.use?await window.claude.use('dictation'):null;
    if(!dic)return;
    dic.onPartial(({text})=>{const p=$('#dpart');if(p)p.textContent=text});
    dic.onFinal(({text})=>{const t=$('#dtxt');if(t){t.value=(t.value&&!t.value.endsWith('\n')?t.value+'\n':t.value)+text.trim()+'\n';draftText=t.value}const p=$('#dpart');if(p)p.textContent=''});
    dic.onState(({state})=>{listening=state==='listening';const b=$('#micbtn');if(b){b.classList.toggle('on',listening);b.innerHTML=listening?'■ Parar':ic('mic',17)+' Ditar'}});
    if(tab==='ditar')render();
  }catch(e){dic=null}
})();
(async()=>{
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}

})();

(function(){const vv=window.visualViewport;if(!vv)return;const f=()=>{const r=document.documentElement.style;r.setProperty('--vvh',vv.height+'px');r.setProperty('--vvt',vv.offsetTop+'px')};vv.addEventListener('resize',f);vv.addEventListener('scroll',f);f()})();
document.addEventListener('focusin',e=>{const t=e.target;if(!(t&&t.closest&&t.closest('.modal')&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)))return;
  const txt=t.matches('input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=month]):not([type=file]),textarea'),vv=window.visualViewport;
  if(txt&&(!vv||vv.height>=window.innerHeight-80))document.body.classList.add('kb');
  setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},320)});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches('.modal input,.modal textarea'))document.body.classList.remove('kb')},200));
render();
setTimeout(()=>refreshQuotes(false),400);
})();
